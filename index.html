<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KINGDOM</title>
<style>
html,body{margin:0;height:100%;background:#07060a;color:#e8d9b0;font-family:Georgia,serif;overflow:hidden}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;background:#07060a}
#boot h1{letter-spacing:.4em;font-weight:400}
#hud{position:fixed;left:12px;top:8px;font:13px ui-monospace,monospace;color:#b8f0b0;z-index:5;text-shadow:0 1px 4px #000;pointer-events:none}
#banner{position:fixed;left:50%;top:16%;transform:translateX(-50%);width:min(640px,90vw);text-align:center;z-index:5;pointer-events:none;text-shadow:0 2px 10px #000;white-space:pre-wrap}
</style>
</head>
<body>
<div id="boot"><h1>KINGDOM</h1><p>Entering VR…</p></div>
<div id="hud"></div>
<div id="banner"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const mode = new URLSearchParams(location.search).get('mode') === 'free' ? 'free' : 'story';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0a10);
scene.fog = new THREE.Fog(0x0c0a10, 20, 160);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.08, 500);
const player = new THREE.Group();
player.position.set(0, 1.5, 4);
scene.add(player);
player.add(camera);

scene.add(new THREE.HemisphereLight(0x8899bb, 0x22180c, 0.55));
const sun = new THREE.DirectionalLight(0xffe6b0, 1.1);
sun.position.set(18, 40, 12);
scene.add(sun);

const vel = new THREE.Vector3();
const solids = [];
function box(x,y,z,w,h,d,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color, roughness:0.88}));
  m.position.set(x,y,z); scene.add(m); m.updateMatrixWorld();
  solids.push(new THREE.Box3().setFromObject(m));
  return m;
}

const shards = [];
function shard(id, name, x,y,z){
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.32), new THREE.MeshStandardMaterial({color:0xffe08a, emissive:0xaa6622, emissiveIntensity:0.85}));
  m.position.set(x,y,z); m.userData = {id,name,got:false}; scene.add(m); shards.push(m);
}

// FREEPLAY: small yard, no hour-long trail
function buildFree(){
  box(0,-0.5,0, 40,1,40, 0x2a2420);
  for(let i=0;i<8;i++) box((i-4)*4, 0.8, -6, 2.5,0.3,2.5, 0x3a4a30);
  shard("F1","Echo", 0,2,-8);
  shard("F2","Quiet", 8,2,0);
}

// STORY: long pilgrimage — hundreds of platforms (~designed to take a long session)
function buildStory(){
  box(0,-0.5,0, 24,1,24, 0x3a3228);
  let z = -6, y = 0.3, x = 0;
  // Act 1 long slope
  for(let i=0;i<40;i++){
    x = Math.sin(i*0.3)*3;
    y = 0.25 + i*0.12;
    z = -8 - i*2.1;
    box(x,y,z, 3.2,0.32,2.6, 0x4a4034);
  }
  shard("I","Dawn-That-Stuck", x, y+1.3, z);

  // Act 2 wood
  for(let i=0;i<45;i++){
    x = Math.sin(i*0.5)*8;
    y = 5 + Math.sin(i*0.2)*2;
    z -= 2.0;
    box(x,y,z, 2.8,0.3,2.4, 0x35582c);
  }
  shard("V","Green Hour", x, y+1.3, z);

  // Act 3 river
  for(let i=0;i<40;i++){
    x = 6 + Math.sin(i*0.4)*4;
    y = 6 + i*0.08;
    z -= 2.0;
    box(x,y,z, 3.0,0.3,2.5, 0x3a4a58);
  }
  shard("III","Tide-Wrong", x-2, y+1.3, z);
  shard("VI","The Quiet Lung", x+2, y+1.6, z-2);

  // Act 4 market terraces
  for(let i=0;i<36;i++){
    x = -6 + (i%4)*4;
    y = 10 + Math.floor(i/4)*1.1;
    z -= (i%4===0)?2.4:0.2;
    box(x,y,z, 3.4,0.3,3.0, 0x5a4030);
  }
  shard("II","The Second Mouth", x, y+1.3, z);
  shard("IV","Market Bell", x-3, y+1.6, z+2);

  // Act 5 spine — the long climb
  for(let i=0;i<70;i++){
    x = (i%2? -3.2:3.2);
    y = 14 + i*0.55;
    z -= 1.7;
    box(x,y,z, 3.6,0.32,2.4, 0x4a4450);
  }
  shard("VII","Mirror Noon", 0, y+1.2, z+4);
  shard("IX","Climbing Dusk", x, y+1.3, z);
  shard("X","Uncounted", -x, y+2, z-3);

  // Act 6 throne
  box(0, y+6, z-10, 16,1,16, 0x201018);
  box(0, y+10, z-12, 6,0.4,6, 0x3a1020);
  shard("VIII","Hollow Speech", -3, y+11.2, z-12);
  shard("XI","The Reverse", 3, y+11.2, z-13);
  shard("XII","Last Light", 0, y+14, z-12);
}

if(mode==='free') buildFree(); else buildStory();

const ctrl = [renderer.xr.getController(0), renderer.xr.getController(1)];
const grips = [renderer.xr.getControllerGrip(0), renderer.xr.getControllerGrip(1)];
ctrl.forEach(c=>player.add(c));
grips.forEach((g,i)=>{
  player.add(g);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.07,0.07,0.12), new THREE.MeshStandardMaterial({color:i?0xff8866:0x66ccff})));
});

const last = [new THREE.Vector3(), new THREE.Vector3()];
const ready = [false,false];
const hold = [false,false];
const wpos = new THREE.Vector3();
const tmp = new THREE.Vector3();

function squeezed(src){
  if(!src||!src.gamepad) return false;
  const b = src.gamepad.buttons;
  return (b[1]&&b[1].pressed) || (b[0]&&b[0].pressed);
}

let bannerT=0;
function say(t){ document.getElementById('banner').textContent=t; bannerT=7; }
say(mode==='story'
  ? "STORY\nThe Crown is twelve hours. Swing the controllers. No hand tracking."
  : "FREEPLAY\nA yard. No pilgrimage. Swing and look.");

const collected = new Set();
const clock = new THREE.Clock();

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  if(renderer.xr.isPresenting){
    const session = renderer.xr.getSession();
    if(session){
      session.inputSources.forEach(src=>{
        const i = src.handedness==='right'?1:0;
        hold[i] = squeezed(src);
        ctrl[i].getWorldPosition(wpos);
        if(!hold[i]){ last[i].copy(wpos); ready[i]=true; return; }
        if(!ready[i]){ last[i].copy(wpos); ready[i]=true; return; }
        tmp.copy(last[i]).sub(wpos).multiplyScalar(44);
        vel.add(tmp);
        last[i].copy(wpos);
      });
    }
  }

  vel.y -= 18*dt;
  vel.x *= Math.pow(0.12, dt);
  vel.z *= Math.pow(0.12, dt);
  if(vel.length()>30) vel.setLength(30);
  const next = player.position.clone().addScaledVector(vel, dt);
  for(const b of solids){
    if(next.x+0.25<b.min.x||next.x-0.25>b.max.x) continue;
    if(next.z+0.25<b.min.z||next.z-0.25>b.max.z) continue;
    if(player.position.y >= b.max.y-0.08 && next.y <= b.max.y+1.15){
      next.y = b.max.y+1.15;
      if(vel.y<0) vel.y=0;
    }
  }
  if(next.y<-15){ next.copy(new THREE.Vector3(0,2,4)); vel.set(0,0,0); say("The mountain caught you."); }
  player.position.copy(next);

  shards.forEach(m=>{
    if(m.userData.got) return;
    m.rotation.y += dt*1.5;
    if(player.position.distanceTo(m.position)<1.35){
      m.userData.got = true; m.visible=false;
      collected.add(m.userData.id);
      say("Shard "+m.userData.id+" — "+m.userData.name+"\n"+collected.size+" collected");
      if(mode==='story' && collected.size>=12){
        say("The Reversed Throne is quiet.\nThe Crown is gathered.\nStory complete.");
      }
    }
  });

  if(bannerT>0){ bannerT-=dt; document.getElementById('banner').style.opacity = bannerT>1?1:Math.max(0,bannerT); }
  document.getElementById('hud').textContent =
    "KINGDOM  "+mode.toUpperCase()+"  shards "+collected.size+"/"+(mode==='story'?12:2)+"  |  Grip + swing controllers";

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

async function enterVR(){
  document.getElementById('boot').querySelector('p').textContent = 'Requesting VR…';
  if(!navigator.xr){
    document.getElementById('boot').querySelector('p').textContent = 'No WebXR here. On Quest, use this APK or Quest Browser.';
    return;
  }
  try{
    const session = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor','bounded-floor']});
    await renderer.xr.setSession(session);
    document.getElementById('boot').style.display='none';
    session.addEventListener('end', ()=>{ document.getElementById('boot').style.display='flex'; });
  }catch(e){
    document.getElementById('boot').querySelector('p').textContent = 'VR blocked: '+e.message+' — tap the page.';
    addEventListener('click', enterVR, {once:true});
  }
}
enterVR();
addEventListener('load', enterVR);
setTimeout(enterVR, 400);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
