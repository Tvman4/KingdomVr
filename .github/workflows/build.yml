# Signed RELEASE APK for com.Tvman.KingdomVr → GitHub Releases
# Keystore is created inside this workflow. Not a debug build.
# Does NOT use android-actions/setup-android (that action still runs `sdkmanager tools`, which no longer exists).
name: Build Kingdom VR APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses and install platform
        run: |
          set -e
          SDK="${ANDROID_HOME}"
          SM=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/12.0/bin/sdkmanager"
          do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then
            echo "sdkmanager not found"; ls -la "$SDK/cmdline-tools" || true; exit 1
          fi
          echo "Using $SM"
          yes | "$SM" --licenses >/tmp/licenses.log 2>&1 || true
          tail -5 /tmp/licenses.log || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - name: Create release keystore inside CI
        run: |
          mkdir -p signing
          keytool -genkeypair -keystore signing/kingdom.keystore \
            -alias kingdom -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kingdom-store -keypass kingdom-key \
            -dname "CN=KingdomVr, OU=Tvman, O=Tvman, L=Aetherhold, ST=NA, C=US"
          echo "KINGDOM_KEYSTORE=$GITHUB_WORKSPACE/signing/kingdom.keystore" >> "$GITHUB_ENV"
          echo "KINGDOM_STORE_PASSWORD=kingdom-store" >> "$GITHUB_ENV"
          echo "KINGDOM_KEY_ALIAS=kingdom" >> "$GITHUB_ENV"
          echo "KINGDOM_KEY_PASSWORD=kingdom-key" >> "$GITHUB_ENV"

      - name: Install Gradle and build signed release
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp
          /tmp/gradle-8.6/bin/gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          test -n "$APK"
          cp "$APK" dist/KingdomVr-signed.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: KingdomVr-signed
          path: dist/KingdomVr-signed.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kingdom VR v1.0.${{ github.run_number }}
          body: |
            Signed release APK (not debug)
            applicationId: com.Tvman.KingdomVr
          files: dist/KingdomVr-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
